# Comprehensive PR Check Workflow with lintdiff
# ===============================================
# This workflow provides a complete PR checking solution that:
# - Runs lintdiff to identify lint issues in changed code
# - Posts results as PR comments with GitHub annotations
# - Uploads detailed reports as artifacts
# - Provides a clear pass/fail status
#
# Features demonstrated:
# - Pull request event handling
# - GitHub annotations for in-line feedback
# - PR comment posting with summary
# - Conditional artifact upload
# - Status check for branch protection
#
# To use: Copy this file to .github/workflows/pr-check.yml

name: PR Check

on:
  pull_request:
    # Trigger on all PR activity
    types: [opened, synchronize, reopened, ready_for_review]
  # Allow manual triggering for re-runs
  workflow_dispatch:

# Set required permissions for PR comments and annotations
permissions:
  # Required for posting PR comments
  pull-requests: write
  # Required for checkout
  contents: read
  # Required for GitHub annotations
  checks: write

# Cancel in-progress runs when new commits are pushed
concurrency:
  group: pr-check-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # Main lintdiff analysis job
  lintdiff:
    name: Analyze PR changes
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout with full history for accurate diff
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Checkout the PR head for accurate diff calculation
          ref: ${{ github.event.pull_request.head.sha }}

      # Step 2: Set up Rust with caching
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Step 3: Run clippy to generate diagnostics
      # Using --all-features to check all code paths
      # Using --all-targets to check tests, examples, etc.
      - name: Run Clippy
        id: clippy
        run: |
          echo "Running clippy analysis..."
          cargo clippy \
            --all-features \
            --all-targets \
            --message-format=json \
            2>/dev/null > clippy.jsonl || true
          
          # Count total diagnostics for summary
          TOTAL_DIAGNOSTICS=$(wc -l < clippy.jsonl || echo "0")
          echo "total_diagnostics=$TOTAL_DIAGNOSTICS" >> "$GITHUB_OUTPUT"
          echo "Clippy found $TOTAL_DIAGNOSTICS total diagnostics"

      # Step 4: Run lintdiff to filter to changed lines
      # The action automatically posts GitHub annotations
      - name: Run lintdiff analysis
        id: lintdiff
        uses: effortless-metrics/lintdiff@v0.1.0
        with:
          diagnostics: clippy.jsonl
          # Use the PR base and head refs
          base: origin/${{ github.base_ref }}
          head: ${{ github.event.pull_request.head.sha }}
          # Fail on errors in changed code
          fail_on: error
        continue-on-error: true

      # Step 5: Generate detailed summary for PR comment
      - name: Generate PR comment
        id: comment
        if: always()
        run: |
          # Create comment body with results summary
          cat << 'EOF' > comment.md
          ## 🔍 lintdiff Analysis Results
          
          EOF
          
          # Add verdict with appropriate emoji
          VERDICT="${{ steps.lintdiff.outputs.verdict }}"
          case "$VERDICT" in
            pass)
              echo "✅ **Status: Passed** - No new lint issues in changed code" >> comment.md
              ;;
            warn)
              echo "⚠️ **Status: Warnings** - New warnings detected in changed code" >> comment.md
              ;;
            fail)
              echo "❌ **Status: Failed** - New errors detected in changed code" >> comment.md
              ;;
            skip)
              echo "⏭️ **Status: Skipped** - No Rust changes detected" >> comment.md
              ;;
            *)
              echo "❓ **Status: Unknown** ($VERDICT)" >> comment.md
              ;;
          esac
          
          cat << 'EOF' >> comment.md
          
          ### 📊 Summary
          
          | Metric | Value |
          |--------|-------|
          | Total Clippy Diagnostics | ${{ steps.clippy.outputs.total_diagnostics }} |
          | lintdiff Verdict | ${{ steps.lintdiff.outputs.verdict }} |
          | Exit Code | ${{ steps.lintdiff.outputs.exit_code }} |
          
          ### 📥 Detailed Report
          
          Download the `lintdiff-report` artifact for the complete JSON report with all findings.
          
          ---
          
          *This comment was automatically generated by the lintdiff CI workflow.*
          EOF
          
          # Store comment for next step
          echo "comment_file=comment.md" >> "$GITHUB_OUTPUT"

      # Step 6: Post comment to PR
      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const commentBody = fs.readFileSync('comment.md', 'utf8');
            
            // Find existing comment from this workflow
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('🔍 lintdiff Analysis Results')
            );
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }

      # Step 7: Upload report artifact
      - name: Upload lintdiff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lintdiff-report
          path: artifacts/lintdiff/
          if-no-files-found: ignore
          retention-days: 30

      # Step 8: Add workflow summary
      - name: Add workflow summary
        if: always()
        run: |
          echo "## lintdiff PR Analysis Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Verdict | ${{ steps.lintdiff.outputs.verdict }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Exit Code | ${{ steps.lintdiff.outputs.exit_code }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Report Path | ${{ steps.lintdiff.outputs.report_path }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "A detailed comment has been posted to the PR." >> $GITHUB_STEP_SUMMARY

      # Step 9: Set final status based on lintdiff result
      # This ensures the workflow fails if lintdiff found errors
      - name: Check lintdiff result
        if: steps.lintdiff.outputs.verdict == 'fail'
        run: |
          echo "::error::lintdiff found errors in changed code. Please review the PR comment and fix the issues."
          exit 1
