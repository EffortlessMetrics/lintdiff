name: Benchmarks

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
  pull_request:
    paths:
      - 'crates/**'
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Run benchmarks
        run: cargo bench --workspace
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: criterion-results
          path: target/criterion
