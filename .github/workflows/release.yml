name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out tagged release
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate annotated tag and release commit
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/}"
          test -n "$VERSION"
          test "$VERSION" != "$GITHUB_REF"
          TAG_SHA="$(git rev-list -n 1 "$VERSION")"
          test "$TAG_SHA" = "$GITHUB_SHA"
          TAG_TYPE="$(git cat-file -t "$VERSION")"
          test "$TAG_TYPE" = tag
          echo "release_commit=${TAG_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          VERSION_NUM="${VERSION#v}"
          echo "version=${VERSION_NUM}" >> $GITHUB_OUTPUT
          echo "Determined version: ${VERSION_NUM} (tag: ${VERSION})"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            strip: true
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            strip: true
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            strip: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            strip: false

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache target directory
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-target-

      - name: Install cross-compilation tools for aarch64-apple-darwin
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          rustup target add aarch64-apple-darwin

      - name: Build release binary
        env:
          GIT_SHA: ${{ github.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: cargo build --release --target ${{ matrix.target }} -p lintdiff

      - name: Strip debug symbols (Unix)
        if: matrix.strip && matrix.archive == 'tar.gz'
        run: |
          strip target/${{ matrix.target }}/release/lintdiff || echo "Strip failed, continuing..."

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../lintdiff-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.tar.gz lintdiff
          cd ../../..
          sha256sum lintdiff-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.tar.gz > lintdiff-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.tar.gz.sha256

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../lintdiff-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.zip lintdiff.exe
          cd ../../..
          sha256sum lintdiff-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.zip > lintdiff-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.zip.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: lintdiff-${{ matrix.target }}
          path: |
            lintdiff-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.*

  checksums:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Generate combined checksums file
        run: |
          cat lintdiff-${{ needs.prepare.outputs.version }}-*.sha256 > checksums-${{ needs.prepare.outputs.version }}.txt
          echo "Checksums:"
          cat checksums-${{ needs.prepare.outputs.version }}.txt

      - uses: actions/upload-artifact@v7
        with:
          name: checksums
          path: checksums-${{ needs.prepare.outputs.version }}.txt

  publish-crates-io:
    name: Publish crates through Shipper
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"

      - name: Install pinned Shipper
        run: |
          cargo install shipper --version 0.4.0 --locked
          shipper --version

      - name: Run lintdiff release gates
        run: |
          cargo run -p xtask -- package-check
          cargo run -p xtask -- release-contract-check

      - name: Build Shipper plan
        run: |
          set -o pipefail
          mkdir -p .shipper
          shipper plan \
            --registry crates-io \
            --state-dir .shipper \
            --format json | tee .shipper/plan.json

      - name: Validate Shipper plan
        run: |
          set -o pipefail
          cargo run -p xtask -- publication-plan-check .shipper/plan.json \
            | tee .shipper/plan-validation.txt

      - name: Upload Shipper plan and validation evidence
        uses: actions/upload-artifact@v7
        with:
          name: shipper-plan-${{ needs.prepare.outputs.version }}
          path: .shipper/**
          include-hidden-files: true
          if-no-files-found: error

      - name: Run Shipper preflight
        run: |
          set -o pipefail
          shipper preflight \
            --registry crates-io \
            --state-dir .shipper \
            --policy safe \
            --format json | tee .shipper/preflight.json

      - name: Upload Shipper preflight evidence
        uses: actions/upload-artifact@v7
        with:
          name: shipper-preflight-${{ needs.prepare.outputs.version }}
          path: .shipper/**
          include-hidden-files: true
          if-no-files-found: error

      - name: Publish through Shipper
        run: |
          set -o pipefail
          shipper publish \
            --registry crates-io \
            --state-dir .shipper \
            --policy safe \
            --verify-mode package \
            --readiness-method both \
            --readiness-timeout 15m \
            --verify-timeout 10m \
            --max-attempts 12 \
            --base-delay 10s \
            --max-delay 15m \
            --retry-strategy exponential \
            --format json | tee .shipper/publish.json

      - name: Bundle final Shipper state
        run: tar -czf shipper-release-state.tar.gz .shipper

      - name: Upload final Shipper evidence
        uses: actions/upload-artifact@v7
        with:
          name: shipper-final-${{ needs.prepare.outputs.version }}
          path: |
            .shipper/**
            shipper-release-state.tar.gz
          include-hidden-files: true
          if-no-files-found: error

  release:
    needs: [prepare, build, checksums, publish-crates-io]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: lintdiff-*
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: checksums
          path: .

      - uses: actions/download-artifact@v8
        with:
          name: shipper-final-${{ needs.prepare.outputs.version }}
          path: shipper-final

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          # Extract changelog section for this version
          if [ -f CHANGELOG.md ]; then
            # Get the section between this version and the next version header
            CHANGELOG=$(sed -n "/^## \\[${VERSION}\\]/,/^## \\[/p" CHANGELOG.md | sed '$d')
            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="## What's Changed\n\nSee CHANGELOG.md for full details."
            fi
          else
            CHANGELOG="## What's Changed\n\nSee commit history for details."
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo -e "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Release ${{ needs.prepare.outputs.tag }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.tag, '-') }}
          files: |
            lintdiff-${{ needs.prepare.outputs.version }}-*
            checksums-${{ needs.prepare.outputs.version }}.txt
            shipper-final/shipper-release-state.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          echo "## Release ${{ needs.prepare.outputs.tag }} created! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for f in lintdiff-${{ needs.prepare.outputs.version }}-*; do
            echo "- \`$f\`" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- \`checksums-${{ needs.prepare.outputs.version }}.txt\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`shipper-release-state.tar.gz\`" >> $GITHUB_STEP_SUMMARY
