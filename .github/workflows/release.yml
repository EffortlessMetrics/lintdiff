name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      mode:
        description: Release operation to run without publication by default
        type: choice
        options:
          - rehearse
          - binaries
          - resume
        default: rehearse
        required: true
      ref:
        description: Exact branch, tag, or commit to check out
        required: false
        type: string
      artifact_run_id:
        description: Prior release run containing Shipper state (resume only)
        required: false
        type: string

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.version.outputs.mode }}
      checkout_ref: ${{ steps.version.outputs.checkout_ref }}
      commit: ${{ steps.version.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out tagged release
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.ref || github.sha }}

      - name: Validate exact ref and resolve release identity
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            MODE="tag"
            REQUESTED_REF="${GITHUB_REF#refs/tags/}"
            TAG_SHA="$(git rev-list -n 1 "$REQUESTED_REF")"
            test "$TAG_SHA" = "$GITHUB_SHA"
            TAG_TYPE="$(git cat-file -t "$REQUESTED_REF")"
            test "$TAG_TYPE" = tag
            VERSION_NUM="${REQUESTED_REF#v}"
            TAG="$REQUESTED_REF"
          else
            MODE="${{ inputs.mode }}"
            REQUESTED_REF="${{ inputs.ref }}"
            case "$MODE" in
              rehearse|binaries)
                ;;
              resume)
                test -n "$REQUESTED_REF"
                test -n "${{ inputs.artifact_run_id }}"
                ;;
              *)
                echo "unsupported release mode: $MODE" >&2
                exit 1
                ;;
            esac
            if [ -z "$REQUESTED_REF" ]; then
              REQUESTED_REF="$GITHUB_SHA"
            fi
            TAG_SHA="$(git rev-parse "${REQUESTED_REF}^{commit}")"
            test "$TAG_SHA" = "$(git rev-parse HEAD)"
            VERSION_NUM="$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml | sed -n 's/^version = "\([^"]*\)"/\1/p' | head -n 1)"
            test -n "$VERSION_NUM"
            TAG=""
            if [ "$MODE" = "resume" ]; then
              TAG_TYPE="$(git cat-file -t "$REQUESTED_REF")"
              test "$TAG_TYPE" = tag
              TAG="$REQUESTED_REF"
            fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$REQUESTED_REF" >> "$GITHUB_OUTPUT"
          echo "commit=$TAG_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_NUM" >> "$GITHUB_OUTPUT"
          echo "Resolved mode=$MODE ref=$REQUESTED_REF commit=$TAG_SHA version=$VERSION_NUM"

  build:
    if: ${{ github.event_name == 'push' || inputs.mode == 'binaries' }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            strip: true
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            strip: true
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            strip: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            strip: false

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache target directory
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-target-

      - name: Install cross-compilation tools for aarch64-apple-darwin
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          rustup target add aarch64-apple-darwin

      - name: Build release binary
        env:
          GIT_SHA: ${{ github.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: cargo build --release --target ${{ matrix.target }} -p lintdiff

      - name: Strip debug symbols (Unix)
        if: matrix.strip && matrix.archive == 'tar.gz'
        run: |
          strip target/${{ matrix.target }}/release/lintdiff || echo "Strip failed, continuing..."

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../lintdiff-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.tar.gz lintdiff
          cd ../../..
          sha256sum lintdiff-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.tar.gz > lintdiff-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.tar.gz.sha256

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../lintdiff-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.zip lintdiff.exe
          cd ../../..
          sha256sum lintdiff-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.zip > lintdiff-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.zip.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: lintdiff-${{ matrix.target }}
          path: |
            lintdiff-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.*

  checksums:
    if: ${{ github.event_name == 'push' || inputs.mode == 'binaries' }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Generate combined checksums file
        run: |
          cat lintdiff-${{ needs.prepare.outputs.version }}-*.sha256 > checksums-${{ needs.prepare.outputs.version }}.txt
          echo "Checksums:"
          cat checksums-${{ needs.prepare.outputs.version }}.txt

      - uses: actions/upload-artifact@v7
        with:
          name: checksums
          path: checksums-${{ needs.prepare.outputs.version }}.txt

  rehearse:
    name: Rehearse Shipper release without publication
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'rehearse' }}
    needs: prepare
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"

      - name: Install pinned Shipper
        run: |
          cargo install shipper --version 0.4.0 --locked
          shipper --version

      - name: Run lintdiff release gates
        run: |
          cargo run -p xtask -- package-check
          cargo run -p xtask -- release-contract-check

      - name: Build Shipper plan
        id: plan
        run: |
          set -o pipefail
          mkdir -p .shipper
          shipper plan \
            --registry crates-io \
            --state-dir .shipper \
            --format json | tee .shipper/plan.json

      - name: Validate Shipper plan
        id: validate_plan
        if: ${{ always() && steps.plan.outcome == 'success' }}
        run: |
          set -o pipefail
          cargo run -p xtask -- publication-plan-check .shipper/plan.json \
            | tee .shipper/plan-validation.txt

      - name: Attempt Trusted Publishing authentication
        id: crates_auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@v1

      - name: Select crates.io credential and write redacted evidence
        id: auth
        env:
          TRUSTED_TOKEN: ${{ steps.crates_auth.outputs.token }}
          FALLBACK_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          AUTH_ACTION_OUTCOME: ${{ steps.crates_auth.outcome }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_ENVIRONMENT: release
        run: bash scripts/release/select-crates-auth.sh .shipper/auth-evidence.json

      - name: Upload Shipper plan evidence
        id: upload_plan
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: shipper-state-plan-${{ needs.prepare.outputs.version }}
          path: .shipper/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn

      - name: Run Shipper preflight
        id: preflight
        if: ${{ always() && steps.plan.outcome == 'success' && steps.validate_plan.outcome == 'success' && steps.auth.outcome == 'success' && steps.upload_plan.outcome == 'success' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -o pipefail
          shipper preflight \
            --registry crates-io \
            --state-dir .shipper \
            --policy safe \
            --format json | tee .shipper/preflight.json

      - name: Upload Shipper preflight evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: shipper-state-preflight-${{ needs.prepare.outputs.version }}
          path: .shipper/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn

      - name: Bundle final Shipper state
        if: ${{ always() }}
        run: |
          if [ -d .shipper ]; then
            tar -czf shipper-release-state.tar.gz .shipper
          fi

      - name: Upload final Shipper evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: shipper-state-final-${{ needs.prepare.outputs.version }}
          path: |
            .shipper/
            shipper-release-state.tar.gz
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn

  publish-crates-io:
    name: Publish or resume crates through Shipper
    if: ${{ github.event_name == 'push' || inputs.mode == 'resume' }}
    needs: prepare
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"

      - name: Install pinned Shipper
        run: |
          cargo install shipper --version 0.4.0 --locked
          shipper --version

      - name: Run lintdiff release gates
        run: |
          cargo run -p xtask -- package-check
          cargo run -p xtask -- release-contract-check

      - name: Restore prior Shipper state for resume
        if: ${{ inputs.mode == 'resume' }}
        uses: actions/download-artifact@v8
        with:
          pattern: shipper-state-final-*
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .shipper-restore
          merge-multiple: true

      - name: Install restored Shipper state
        if: ${{ inputs.mode == 'resume' }}
        run: |
          set -euo pipefail
          test -d .shipper-restore
          mkdir -p .shipper
          cp -R .shipper-restore/. .shipper/

      - name: Validate restored Shipper state
        id: validate_state
        if: ${{ inputs.mode == 'resume' }}
        run: bash scripts/release/validate-shipper-state.sh .shipper

      - name: Build Shipper plan
        id: plan
        if: ${{ github.event_name == 'push' }}
        run: |
          set -o pipefail
          mkdir -p .shipper
          shipper plan \
            --registry crates-io \
            --state-dir .shipper \
            --format json | tee .shipper/plan.json

      - name: Validate Shipper plan
        id: validate_plan
        if: ${{ github.event_name == 'push' && steps.plan.outcome == 'success' }}
        run: |
          set -o pipefail
          cargo run -p xtask -- publication-plan-check .shipper/plan.json \
            | tee .shipper/plan-validation.txt

      - name: Attempt Trusted Publishing authentication
        id: crates_auth
        continue-on-error: true
        if: ${{ github.event_name == 'push' || (inputs.mode == 'resume' && steps.validate_state.outcome == 'success') }}
        uses: rust-lang/crates-io-auth-action@v1

      - name: Select crates.io credential and write redacted evidence
        id: auth
        if: ${{ github.event_name == 'push' || (inputs.mode == 'resume' && steps.validate_state.outcome == 'success') }}
        env:
          TRUSTED_TOKEN: ${{ steps.crates_auth.outputs.token }}
          FALLBACK_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          AUTH_ACTION_OUTCOME: ${{ steps.crates_auth.outcome }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_ENVIRONMENT: release
        run: bash scripts/release/select-crates-auth.sh .shipper/auth-evidence.json

      - name: Upload Shipper plan evidence
        id: upload_plan
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: shipper-state-plan-${{ needs.prepare.outputs.version }}
          path: .shipper/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn

      - name: Run Shipper preflight
        id: preflight
        if: ${{ github.event_name == 'push' && steps.plan.outcome == 'success' && steps.validate_plan.outcome == 'success' && steps.auth.outcome == 'success' && steps.upload_plan.outcome == 'success' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -o pipefail
          shipper preflight \
            --registry crates-io \
            --state-dir .shipper \
            --policy safe \
            --format json | tee .shipper/preflight.json

      - name: Upload Shipper preflight evidence
        id: upload_preflight
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: shipper-state-preflight-${{ needs.prepare.outputs.version }}
          path: .shipper/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn

      - name: Publish through Shipper
        id: publish
        if: ${{ github.event_name == 'push' && steps.preflight.outcome == 'success' && steps.upload_preflight.outcome == 'success' && steps.auth.outcome == 'success' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -o pipefail
          shipper publish \
            --registry crates-io \
            --state-dir .shipper \
            --policy safe \
            --verify-mode package \
            --readiness-method both \
            --readiness-timeout 15m \
            --verify-timeout 10m \
            --max-attempts 12 \
            --base-delay 10s \
            --max-delay 15m \
            --retry-strategy exponential \
            --format json | tee .shipper/publish.json

      - name: Resume through Shipper
        id: resume
        if: ${{ inputs.mode == 'resume' && steps.validate_state.outcome == 'success' && steps.auth.outcome == 'success' && steps.upload_plan.outcome == 'success' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -o pipefail
          shipper resume \
            --registry crates-io \
            --state-dir .shipper \
            --policy safe \
            --verify-mode package \
            --readiness-method both \
            --readiness-timeout 15m \
            --verify-timeout 10m \
            --max-attempts 12 \
            --base-delay 10s \
            --max-delay 15m \
            --retry-strategy exponential \
            --format json | tee .shipper/resume.json

      - name: Bundle final Shipper state
        if: ${{ always() }}
        run: |
          if [ -d .shipper ]; then
            tar -czf shipper-release-state.tar.gz .shipper
          fi

      - name: Upload final Shipper evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: shipper-state-final-${{ needs.prepare.outputs.version }}
          path: |
            .shipper/
            shipper-release-state.tar.gz
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn

  release:
    if: ${{ always() && (github.event_name == 'push' || inputs.mode == 'resume') && needs.prepare.result == 'success' && needs.publish-crates-io.result == 'success' }}
    needs: [prepare, build, checksums, publish-crates-io]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - uses: actions/download-artifact@v8
        if: ${{ github.event_name == 'push' }}
        with:
          pattern: lintdiff-*
          merge-multiple: true

      - uses: actions/download-artifact@v8
        if: ${{ github.event_name == 'push' }}
        with:
          name: checksums
          path: .

      - uses: actions/download-artifact@v8
        if: ${{ inputs.mode == 'resume' }}
        with:
          pattern: lintdiff-*
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true

      - uses: actions/download-artifact@v8
        if: ${{ inputs.mode == 'resume' }}
        with:
          name: checksums
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .

      - uses: actions/download-artifact@v8
        if: ${{ github.event_name == 'push' }}
        with:
          name: shipper-state-final-${{ needs.prepare.outputs.version }}
          path: shipper-final

      - uses: actions/download-artifact@v8
        if: ${{ inputs.mode == 'resume' }}
        with:
          name: shipper-state-final-${{ needs.prepare.outputs.version }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: shipper-final

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          # Extract changelog section for this version
          if [ -f CHANGELOG.md ]; then
            # Get the section between this version and the next version header
            CHANGELOG=$(sed -n "/^## \\[${VERSION}\\]/,/^## \\[/p" CHANGELOG.md | sed '$d')
            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="## What's Changed\n\nSee CHANGELOG.md for full details."
            fi
          else
            CHANGELOG="## What's Changed\n\nSee commit history for details."
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo -e "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Release ${{ needs.prepare.outputs.tag }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.tag, '-') }}
          files: |
            lintdiff-${{ needs.prepare.outputs.version }}-*
            checksums-${{ needs.prepare.outputs.version }}.txt
            shipper-final/shipper-release-state.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          echo "## Release ${{ needs.prepare.outputs.tag }} created! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for f in lintdiff-${{ needs.prepare.outputs.version }}-*; do
            echo "- \`$f\`" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- \`checksums-${{ needs.prepare.outputs.version }}.txt\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`shipper-release-state.tar.gz\`" >> $GITHUB_STEP_SUMMARY
