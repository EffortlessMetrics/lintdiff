name: ci-queue-continuity

on:
  push:
    paths:
      - ".github/workflows/ci-queue-continuity.yml"
      - "plans/check-ci-queue-continuity.ps1"
      - "plans/ci-queue-continuity-lib.ps1"
      - "plans/ci-queue-continuity.md"
      - "plans/tests/test-ci-queue-continuity.ps1"
  pull_request:
    paths:
      - ".github/workflows/ci-queue-continuity.yml"
      - "plans/check-ci-queue-continuity.ps1"
      - "plans/ci-queue-continuity-lib.ps1"
      - "plans/ci-queue-continuity.md"
      - "plans/tests/test-ci-queue-continuity.ps1"
  workflow_dispatch:

jobs:
  continuity-tests:
    name: Continuity tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run continuity tests
        shell: pwsh
        run: pwsh -NoProfile -File plans/tests/test-ci-queue-continuity.ps1
