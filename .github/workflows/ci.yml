name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --all-features
      - name: Run clippy
        run: cargo clippy --all-features -- -D warnings
      - name: Architecture check
        run: cargo run -p xtask -- architecture-check
      - name: Schema check
        run: cargo run -p xtask -- schema-check
      - name: Fixture check
        run: cargo run -p xtask -- fixture-check
      - name: Documentation check
        run: cargo run -p xtask -- docs-check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          components: clippy
      - name: Run clippy pedantic
        run: cargo clippy --all-features -- -W clippy::all -W clippy::pedantic

  bdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
      - name: BDD (cucumber)
        run: cargo test -p lintdiff --test bdd
