name: release-contract-static

on:
  push:
    paths:
      - ".github/workflows/release.yml"
      - "action.yml"
      - "scripts/action/**"
      - "scripts/release/**"
      - "scripts/verify-release-action-contract.ps1"
      - ".github/workflows/release-action-contract.yml"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "action.yml"
      - "scripts/action/**"
      - "scripts/release/**"
      - "scripts/verify-release-action-contract.ps1"
      - ".github/workflows/release-action-contract.yml"
  workflow_dispatch:

jobs:
  contract-check:
    name: Verify static Action/release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify Action script fixtures
        shell: bash
        run: bash scripts/action/tests/test-action-scripts.sh
      - name: Verify Shipper recovery fixtures
        shell: bash
        run: bash scripts/release/tests/test-shipper-state.sh
      - name: Verify crates.io auth fixtures
        shell: bash
        run: bash scripts/release/tests/test-crates-auth.sh
      - name: Verify release asset contract
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-release-action-contract.ps1
