version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "steven"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      patch-dependencies:
        update-types:
          - "patch"
        patterns:
          - "*"
      uselesskey:
        update-types:
          - "minor"
        patterns:
          - "uselesskey"
      jsonschema:
        update-types:
          - "minor"
        patterns:
          - "jsonschema"
      cucumber:
        update-types:
          - "minor"
        patterns:
          - "cucumber"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "steven"
    labels:
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"
