[package]
name = "lintdiff-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lintdiff-engine = { path = "../crates/lintdiff-engine" }
lintdiff-types = { path = "../crates/lintdiff-types" }
serde_json = "1"

[[bin]]
name = "diff_parser"
path = "fuzz_targets/diff_parser.rs"
test = false
doc = false

[[bin]]
name = "diagnostics_parser"
path = "fuzz_targets/diagnostics_parser.rs"
test = false
doc = false

[[bin]]
name = "finding_fingerprint"
path = "fuzz_targets/finding_fingerprint.rs"
test = false
doc = false

[[bin]]
name = "diagnostic_pairing"
path = "fuzz_targets/diagnostic_pairing.rs"
test = false
doc = false
