name: "lintdiff"
description: "Filter Rust diagnostics to lines changed in a PR and post annotations."
branding:
  icon: "check-circle"
  color: "orange"

inputs:
  base:
    description: "Base ref for diff (default: auto-detect from PR context)"
    required: false
  head:
    description: "Head ref for diff (default: auto-detect from PR context)"
    required: false
  config:
    description: "Path to lintdiff.toml config file"
    required: false
  fail_on:
    description: "Override fail_on policy (error, warn, never)"
    required: false
  diagnostics:
    description: "Path to diagnostics JSONL file (cargo clippy --message-format=json output)"
    required: false
  version:
    description: "lintdiff version to use (default: latest)"
    required: false
    default: "latest"
  working_directory:
    description: "Working directory for lintdiff"
    required: false
    default: "."

outputs:
  verdict:
    description: "Verdict status (pass, warn, fail, skip)"
    value: ${{ steps.run.outputs.verdict }}
  report_path:
    description: "Path to the report JSON file"
    value: ${{ steps.run.outputs.report_path }}
  exit_code:
    description: "Exit code from lintdiff"
    value: ${{ steps.run.outputs.exit_code }}

runs:
  using: "composite"
  steps:
    - name: Determine version
      id: version
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        if [ "$INPUT_VERSION" = "latest" ]; then
          VERSION=$(curl -fsSL https://api.github.com/repos/effortless-metrics/lintdiff/releases/latest | jq -r '.tag_name')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::Failed to determine latest lintdiff version"
            exit 1
          fi
        else
          VERSION="$INPUT_VERSION"
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Download lintdiff
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)

        # TODO: Add support for additional platforms:
        # - linux-aarch64 (ARM64 Linux servers)
        # - windows-x86_64 (Windows runners)
        # These require additional release binaries to be built.
        case "${OS}-${ARCH}" in
          linux-x86_64)  TARGET="x86_64-unknown-linux-musl"  ; EXT="tar.gz" ;;
          darwin-x86_64) TARGET="x86_64-apple-darwin"         ; EXT="tar.gz" ;;
          darwin-arm64)  TARGET="aarch64-apple-darwin"        ; EXT="tar.gz" ;;
          *)
            echo "::error::Unsupported platform: ${OS}-${ARCH}"
            exit 1
            ;;
        esac

        URL="https://github.com/effortless-metrics/lintdiff/releases/download/${VERSION}/lintdiff-${TARGET}.${EXT}"
        echo "Downloading lintdiff ${VERSION} for ${TARGET}..."
        curl -fsSL "$URL" -o "lintdiff-archive.${EXT}"

        if [ "$EXT" = "tar.gz" ]; then
          tar xzf "lintdiff-archive.${EXT}" --strip-components=1
        fi

        chmod +x lintdiff
        echo "$(pwd)" >> "$GITHUB_PATH"

    - name: Run lintdiff
      id: run
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        INPUT_BASE: ${{ inputs.base }}
        INPUT_HEAD: ${{ inputs.head }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_FAIL_ON: ${{ inputs.fail_on }}
        INPUT_DIAGNOSTICS: ${{ inputs.diagnostics }}
      run: |
        ARGS="ci github"

        if [ -n "$INPUT_BASE" ]; then
          ARGS="$ARGS --base \"$INPUT_BASE\""
        fi
        if [ -n "$INPUT_HEAD" ]; then
          ARGS="$ARGS --head \"$INPUT_HEAD\""
        fi
        if [ -n "$INPUT_CONFIG" ]; then
          ARGS="$ARGS --config \"$INPUT_CONFIG\""
        fi
        if [ -n "$INPUT_FAIL_ON" ]; then
          ARGS="$ARGS --fail-on \"$INPUT_FAIL_ON\""
        fi
        if [ -n "$INPUT_DIAGNOSTICS" ]; then
          ARGS="$ARGS --diagnostics \"$INPUT_DIAGNOSTICS\""
        fi

        REPORT_PATH="artifacts/lintdiff/report.json"
        echo "report_path=$REPORT_PATH" >> "$GITHUB_OUTPUT"

        set +e
        eval "lintdiff $ARGS --out \"$REPORT_PATH\" --annotations github"
        EXIT_CODE=$?
        set -e

        echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

        # Extract verdict from report using jq for cross-platform compatibility
        if [ -f "$REPORT_PATH" ]; then
          VERDICT=$(jq -r '.status' "$REPORT_PATH" 2>/dev/null || echo "unknown")
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
        fi

        exit $EXIT_CODE

    - name: Upload report artifact
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: lintdiff-report
        path: ${{ inputs.working_directory }}/artifacts/lintdiff/
        if-no-files-found: ignore
