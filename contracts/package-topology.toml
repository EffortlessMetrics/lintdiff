# Canonical topology declaration for the lintdiff workspace and registry closure.
# Registry and external-consumer gates remain mandatory before publication.

schema_version = 1
campaign = "microcrate-collapse-and-publication-closure"
phase = "enforced"
baseline = "origin/main@ea68d869d3cd224698d4c55f6659ceb4ae5eefdb"
historical_snapshot_packages = 69
live_baseline_packages = 68
runtime_reachability_definition = "normal-and-build-dependencies-from-lintdiff"
external_consumer_gate = "crates.io-version-and-reverse-dependencies-plus-github-search"
line_ending_policy = "future-text-only-no-renormalization"

canonical_runtime = [
  "lintdiff-types",
  "lintdiff-engine",
  "lintdiff-render",
  "lintdiff",
]

publication_closure = [
  "lintdiff-types",
  "lintdiff-engine",
  "lintdiff-render",
  "lintdiff",
]
repository_tooling = ["xtask"]
conditional_dev_support = ["lintdiff-test-support"]
deferred_workspace = []
excluded_auxiliary_workspaces = ["fuzz"]
allowed_actions = ["keep", "fold", "mine_delete", "temporary_wrapper", "defer"]

[[topology]]
name = "lintdiff-types"
class = "public_protocol"
publish = true
publication_intent = true
allowed_lintdiff_dependencies = []

[[topology]]
name = "lintdiff-engine"
class = "public_engine"
publish = true
publication_intent = true
allowed_lintdiff_dependencies = ["lintdiff-types"]

[[topology]]
name = "lintdiff-render"
class = "registry_support_projection"
publish = true
publication_intent = true
allowed_lintdiff_dependencies = ["lintdiff-types"]

[[topology]]
name = "lintdiff"
class = "primary_product"
publish = true
publication_intent = true
allowed_lintdiff_dependencies = ["lintdiff-engine", "lintdiff-render", "lintdiff-types"]

[[topology]]
name = "xtask"
class = "repository_tooling"
publish = false
allowed_lintdiff_dependencies = []

[[topology]]
name = "lintdiff-test-support"
class = "conditional_dev_support"
publish = false
allowed_lintdiff_dependencies = ["lintdiff-types"]
