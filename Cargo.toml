[workspace]
resolver = "2"
members = [
  "crates/lintdiff-jsonl",
  "crates/lintdiff-hunk-header",
  "crates/lintdiff-types",
  "crates/lintdiff-diff",
  "crates/lintdiff-diagnostics",
  "crates/lintdiff-match",
  "crates/lintdiff-ingest-core",
  "crates/lintdiff-policy",
  "crates/lintdiff-fingerprint",
  "crates/lintdiff-finding",
  "crates/lintdiff-finding-builder",
  "crates/lintdiff-stats",
  "crates/lintdiff-render",
  "crates/lintdiff-render-markdown",
  "crates/lintdiff-render-annotations",
  "crates/lintdiff-app-git",
  "crates/lintdiff-app-io",
  "crates/lintdiff-app",
  "crates/lintdiff-cli",
  "crates/lintdiff-config",
  "crates/lintdiff-bdd",
  "crates/lintdiff-bdd-harness",
  "crates/lintdiff-feature-flags",
  "crates/lintdiff-bdd-grid",
  "crates/lintdiff-bench",
  "crates/lintdiff-i18n",
  "crates/lintdiff-locale-detect",
  "crates/lintdiff-exit",
  "crates/lintdiff-explain",
  "crates/lintdiff-truncate",
  "crates/lintdiff-escape",
  "crates/lintdiff-line-range",
  "crates/lintdiff-line-merge",
  "crates/lintdiff-glob",
  "crates/lintdiff-severity",
  "crates/lintdiff-severity-map",
  "crates/lintdiff-code-url",
  "crates/lintdiff-verdict",
  "crates/lintdiff-ci-env",
  "crates/lintdiff-path-norm",
  "crates/lintdiff-sort",
  "crates/lintdiff-span",
  "crates/lintdiff-location",
  "crates/lintdiff-counts",
  "crates/lintdiff-disposition",
  "crates/lintdiff-report-schema",
  "crates/lintdiff-message-norm",
  "crates/lintdiff-render-utils",
  "crates/lintdiff-config-types",
  "crates/lintdiff-code-norm",
  "crates/lintdiff-diff-paths",
  "crates/lintdiff-timestamp",
  "crates/lintdiff-explain-builder",
  "crates/lintdiff-explain-summary",
  "crates/lintdiff-git-info",
  "crates/lintdiff-report-builder",
  "crates/lintdiff-verdict-reason",
  "crates/lintdiff-diagnostic-level",
  "crates/lintdiff-diff-stats",
  "crates/lintdiff-annotation-format",
  "crates/lintdiff-host-info",
  "crates/lintdiff-run-info",
  "crates/lintdiff-slugify",
  "crates/lintdiff-range-merge",
  "crates/lintdiff-message-truncate",
  "crates/lintdiff-code-policy",
  "crates/lintdiff-span-intersect",
  "crates/lintdiff-budget",
  "crates/lintdiff-schema-diff",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
authors = ["Effortless Metrics <opensource@effortlessmetrics.com>"]
repository = "https://github.com/effortless-metrics/lintdiff"
description = "Diff-scoped filter for rustc/Clippy diagnostics, emitting a cockpit-compatible receipt."
readme = "README.md"
keywords = ["lint", "diff", "diagnostics", "clippy", "rust", "github-actions", "ci", "cd", "code-coverage", "fingerprint", "verdict"]
categories = ["command-line-utilities", "development-tools", "parser-implementations"]
homepage = "https://crates.io/crates/lintdiff"
documentation = "https://docs.rs/lintdiff"

[workspace.dependencies]
criterion = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
toml = "1.1"
globset = "0.4"
sha2 = "0.11"
hex = "0.4"
time = { version = "0.3", features = ["formatting", "parsing"] }
uselesskey = { version = "0.9.1", features = ["token", "x509", "jwk"] }
tempfile = "3"
temp-env = "0.3"
proptest = "1"
cargo-semver-checks = "0.40"
fluent = "0.17"
fluent-bundle = "0.16"
unic-langid = "0.9"
lintdiff-types = { path = "crates/lintdiff-types" }
lintdiff-stats = { path = "crates/lintdiff-stats" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_imports = "warn"
unused_must_use = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -2 }
nursery = { level = "warn", priority = -3 }
# Enforce stricter error handling
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
# allow some noise in early iterations; tighten as the code stabilizes
too_many_lines = "allow"
module_name_repetitions = "allow"
