[workspace]
resolver = "2"
members = [
  "crates/lintdiff-types",
  "crates/lintdiff-engine",
  "crates/lintdiff-render",
  "crates/lintdiff",
  "xtask",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
authors = ["Effortless Metrics <opensource@effortlessmetrics.com>"]
repository = "https://github.com/effortless-metrics/lintdiff"
description = "Diff-scoped filter for rustc/Clippy diagnostics, emitting a cockpit-compatible receipt."
readme = "README.md"
keywords = ["lint", "diff", "diagnostics", "clippy", "rust", "github-actions", "ci", "cd", "code-coverage", "fingerprint", "verdict"]
categories = ["command-line-utilities", "development-tools", "parser-implementations"]
homepage = "https://crates.io/crates/lintdiff"
documentation = "https://docs.rs/lintdiff"

[workspace.dependencies]
criterion = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
toml = "1.1"
globset = "0.4"
sha2 = "0.11"
hex = "0.4"
time = { version = "0.3", features = ["formatting", "parsing"] }
uselesskey = { version = "0.10.0", features = ["token", "x509", "jwk"] }
tempfile = "3"
temp-env = "0.3"
proptest = "1"
cargo-semver-checks = "0.40"
jsonschema = "0.49"
fluent = "0.17"
fluent-bundle = "0.16"
unic-langid = "0.9"
lintdiff-types = { version = "0.1.2", path = "crates/lintdiff-types" }
lintdiff-engine = { version = "0.1.2", path = "crates/lintdiff-engine" }
lintdiff-render = { version = "0.1.2", path = "crates/lintdiff-render" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_imports = "warn"
unused_must_use = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -2 }
nursery = { level = "warn", priority = -3 }
# Enforce stricter error handling
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
# allow some noise in early iterations; tighten as the code stabilizes
too_many_lines = "allow"
module_name_repetitions = "allow"
