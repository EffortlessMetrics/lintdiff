[package]
name = "lintdiff"
publish = true
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
description = "CLI for lintdiff - diff-scoped filter for rustc/Clippy diagnostics."
keywords = ["lint", "diff", "clippy", "github-actions", "rust"]
categories = ["command-line-utilities", "development-tools"]
homepage = "https://crates.io/crates/lintdiff"
documentation = "https://docs.rs/lintdiff"

[package.metadata.docs.rs]
all-features = true

[dependencies]
lintdiff-engine.workspace = true
lintdiff-render.workspace = true
lintdiff-types.workspace = true

clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
toml.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
cucumber = "0.23"
uselesskey.workspace = true
regex = "1"
tempfile.workspace = true

[[test]]
name = "bdd"
path = "tests/bdd.rs"
harness = false
