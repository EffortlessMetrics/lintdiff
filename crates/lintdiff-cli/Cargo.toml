[package]
name = "lintdiff"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "CLI for lintdiff - diff-scoped filter for rustc/Clippy diagnostics."
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
documentation.workspace = true

[dependencies]
lintdiff-app = { path = "../lintdiff-app" }
lintdiff-app-git = { path = "../lintdiff-app-git" }
lintdiff-app-io = { path = "../lintdiff-app-io" }
lintdiff-render = { path = "../lintdiff-render" }
lintdiff-types = { path = "../lintdiff-types" }

clap.workspace = true
serde_json.workspace = true

[dev-dependencies]
lintdiff-bdd-harness = { path = "../lintdiff-bdd-harness" }
lintdiff-ingest-core = { path = "../lintdiff-ingest-core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
cucumber = "0.23"
uselesskey.workspace = true
regex = "1"

[[test]]
name = "bdd"
path = "tests/bdd.rs"
harness = false
